name: hackathon-local
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ingestion_local_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ingestion_local_test"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  python:
    build: ./ai-service
    environment:
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?Set AI_SERVICE_TOKEN}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-60}
      LLM_ALLOW_REMOTE: ${LLM_ALLOW_REMOTE:-false}
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  go:
    build: .
    environment:
      APP_ENV: development
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/ingestion_local_test?sslmode=disable
      HTTP_PORT: "8080"
      AUTO_MIGRATE: "true"
      BOOTSTRAP_ADMIN: "true"
      ADMIN_USERNAME: integration_admin
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      COOKIE_SECURE: "false"
      ALLOWED_ORIGINS: http://127.0.0.1:8080,http://localhost:8080,http://localhost:5173
      DOCUMENT_STORAGE_DIR: /app/data/documents
      AI_SERVICE_URL: http://python:8000
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?Set AI_SERVICE_TOKEN}
      INGESTION_ENABLED: "true"
      INGESTION_POLL_INTERVAL: 1s
      RAG_ENABLED: "true"
      RAG_TIMEOUT: 60s
      RAG_MAX_SOURCES: "8"
      RAG_MAX_HISTORY_MESSAGES: "10"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - document-data:/app/data/documents
    depends_on:
      postgres:
        condition: service_healthy
      python:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres-data:
  document-data:
