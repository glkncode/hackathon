# Docker DNS is re-resolved when Compose recreates api.
upstream api_backend {
    zone api_backend 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server api:8080 resolve;
}

# Exclude query strings, credentials, cookies and request bodies.
log_format safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    access_log /var/log/nginx/access.log safe;
    error_log /var/log/nginx/error.log warn;
    client_max_body_size 21m;

    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}\n';
    }

    location = /api {
        return 404;
    }

    location ^~ /api/ {
        # No trailing URI: preserve the original path and query string.
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
        proxy_cache off;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        proxy_intercept_errors off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
